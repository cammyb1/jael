name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (only for major)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          MAJOR=$(echo $VERSION | cut -d. -f1)
          if git rev-list -n 1 v* 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LAST_MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d 'v')
            if [ "$MAJOR" != "$LAST_MAJOR" ]; then
              gh release create "v${VERSION}" --title "v${VERSION} 🚀" --notes "Major Release v${VERSION}: significant changes included. Check the commit history for details."
              echo "Created GitHub Release for major version v${VERSION}"
            fi
          else
            gh release create "v${VERSION}" --title "v${VERSION} 🚀" --notes "Initial Release v${VERSION}"
          fi
          else
            # First release
            gh release create "v${VERSION}" --title "v${VERSION} 🚀" --notes "## Initial Release v${VERSION}"
          fi

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun publish --access public
